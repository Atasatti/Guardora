name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Scan for secrets and service URLs
        run: node scripts/scan-secrets.mjs

      - name: Check backend syntax
        run: node scripts/check-backend-syntax.mjs

      - name: Install web dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint web application
        working-directory: frontend
        run: npm run lint

      - name: Generate Next.js route types
        working-directory: frontend
        run: npx next typegen

      - name: Check web types
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Verify AI model integrity
        run: python3 ai_models/verify_models.py
